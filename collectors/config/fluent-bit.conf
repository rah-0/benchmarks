# https://docs.fluentbit.io/manual/pipeline/outputs/http
# Full synchronization applies to chunks, not individual JSON records.
[SERVICE]
    Flush                     0.1
    Grace                     10
    Log_Level                 error
    scheduler.base            1
    scheduler.cap             1
    storage.path              /data
    storage.sync              full
    storage.checksum          on

[INPUT]
    Name                      stdin
    Tag                       bench
    Buffer_Size               64K
    storage.type              filesystem

[OUTPUT]
    Name                      http
    Match                     *
    Host                      __HOST__
    Port                      __PORT__
    URI                       __URI__
    Format                    json_lines
    Json_date_key             false
    Workers                   1
    Retry_Limit               no_limits
